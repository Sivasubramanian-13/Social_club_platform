<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applicant Registration</title>
</head>
<body>
    <h1>Register for Social Club Event</h1>
    <form action="/register" method="POST">
        <input type="text" name="name" placeholder="Enter your name" required><br><br>
        <input type="number" name="age" placeholder="Enter your age" required><br><br>
        <input type="text" name="phone" placeholder="Enter your phone number" required><br><br>
        <input type="text" name="city" placeholder="Enter your city" required><br><br>
        <button type="submit">Register</button>
    </form>
</body>
</html>
